<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATMQ bookmarklet</title>
</head>
<body>
  <h1>ATMQ Bookmarklet</h1>
  <h2>(Artem Tsitronov "Motivational" quotes)</h2>
  <p><b>~-!-¡-!-¡-!-¡-!-¡-!-¡-!-¡-!-¡-!-¡-!-¡-!-~</b></p>
  <i>Drag this link to your bookmarks bar:</i>
  <p><a href="javascript:(() => { const QUOTES = [ `Don't make it perfect like you. Because you are far from perfect.`, `Make it as stable as possible, we don't want it being like your life.`, `I was gonna roast you, but man... no roast is enough for someone like you.`, `Wanna hear a joke? Your code.`, `If you code in HTML, you're not a programmer. But keep dreaming, perhaps you'll become one! In your dreams.`, `You know, code doesn't need your contribution. It's already bad enough.`, `We all know that you code in Lua. Tsk tsk, what a shame.`, `Go to bed.`, `Please go to bed.`, `Ew, your browser is so dirty, do you clean it? Your search history is also really dirty...`, `Think two times before pushing your code. Actually, think about it... 9... 10... yeah, 10 thousand times.` ]; const BOX = document.createElement(`div`); BOX.textContent = QUOTES[Math.floor(Math.random() * QUOTES.length)]; BOX.style.cssText = ` position: fixed; top: 20px; right: 20px; max-width: 300px; padding: 16px 20px; background: #1e1e2e; color: #cdd6f4; font: 600 16px system-ui; border-radius: 4px; box-shadow: 0 8px 30px rgba(0,0,0,.5); z-index: 2147483647; cursor: pointer; `; BOX.onclick = () => BOX.remove(); document.body.append(BOX); setTimeout(() => BOX.remove(), 6000); })();">"Motivational" quote</a></p>
  <p>Then click it on any page.</p>
  <p><i>Please don't judge my styling, I haven't coded in HTML and JS in ages</i></p>
</body>
</html>
